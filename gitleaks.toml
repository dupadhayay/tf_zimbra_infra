title = "Custom Gitleaks Rules"

[[rules]]
id = "hardcoded-password"

description = "Detect hardcoded passwords"

regex = '''(?i)(password|passwd|pwd|db_password|admin_password|root_password|secret)\s*[:=]\s*["']?([^\s"']{6,})["']?'''

secretGroup = 2

entropy = 3.0

keywords = [
  "password",
  "passwd",
  "pwd",
  "db_password",
  "admin_password",
  "root_password",
  "secret"
]