name: Terraform AI Security Review

on:

  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:

  id-token: write

  contents: read

  pull-requests: write


# ============================================================
# Stage 1 - Security Scan
# ============================================================

jobs:

  security-scan:

    name: Terraform Security Scan

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      - name: Terraform Version

        run: |

          terraform version


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check

        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate

        working-directory: parent_module

        run: |

          terraform validate


      # ======================================================
      # Gitleaks
      # ======================================================

      - name: Install Gitleaks

        run: |

          sudo apt-get update

          sudo apt-get install -y gitleaks


      - name: Run Gitleaks

        run: |

          gitleaks detect \
            --source . \
            --exit-code 1


      # ======================================================
      # TruffleHog
      # ======================================================

      - name: Install TruffleHog

        run: |

          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin


      - name: Run TruffleHog

        run: |

          trufflehog filesystem . --json > trufflehog-report.json


      # ======================================================
      # TFLint
      # ======================================================

      - name: Install TFLint

        run: |

          curl -s \
            https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh \
            | bash


      - name: Run TFLint

        working-directory: parent_module

        run: |

          tflint --init

          tflint


      # ======================================================
      # tfsec
      # ======================================================

      - name: Install tfsec

        run: |

          curl -s \
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | bash


      - name: Run tfsec

        working-directory: parent_module

        run: |

          tfsec .


  # ==========================================================
  # Stage 2 - Terraform Plan
  # ==========================================================

  plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    needs:

      - security-scan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan

        working-directory: parent_module

        run: |

          terraform plan -out=tfplan


      # ------------------------------------------------------
      # Terraform Plan JSON
      # ------------------------------------------------------

      - name: Terraform Show JSON

        working-directory: parent_module

        run: |

          terraform show -json tfplan > tfplan.json


      # ------------------------------------------------------
      # Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "Terraform Plan Files"

          ls -lh parent_module/tfplan

          ls -lh parent_module/tfplan.json

          test -f parent_module/tfplan

          test -f parent_module/tfplan.json

          echo "✅ Terraform plan generated successfully"


      # ------------------------------------------------------
      # Upload Terraform Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan

          path: |

            parent_module/tfplan

            parent_module/tfplan.json


  # ==========================================================
  # Stage 3 - AI Terraform Security Review
  # ==========================================================

  ai-review:

    name: AI Terraform Security Review

    runs-on: ubuntu-latest

    needs:

      - plan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ------------------------------------------------------
      # Python Dependencies
      # ------------------------------------------------------

      - name: Install Python Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r agent/requirements.txt


      # ------------------------------------------------------
      # Download Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan

          path: parent_module


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="

          echo "Terraform Plan Verification"

          echo "=========================================="

          ls -lh parent_module/

          test -f parent_module/tfplan.json

          echo "✅ tfplan.json found"


      # ------------------------------------------------------
      # Verify Agent
      # ------------------------------------------------------

      - name: Verify AI Agent

        run: |

          echo "=========================================="

          echo "AI Agent Verification"

          echo "=========================================="

          echo ""

          ls -lh agent/

          echo ""

          test -f agent/agent.py

          echo "✅ agent.py found"

          echo ""

          python --version

          echo ""

          python -c "import sys; print('Python path:', sys.path)"



      # ------------------------------------------------------
      # Verify Azure Configuration
      # ------------------------------------------------------

      - name: Verify Azure Configuration

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="

          echo "Azure Configuration"

          echo "=========================================="


          if [ -z "$AZURE_SEARCH_ENDPOINT" ]; then

            echo "❌ AZURE_SEARCH_ENDPOINT missing"

            exit 1

          fi


          if [ -z "$AZURE_SEARCH_API_KEY" ]; then

            echo "❌ AZURE_SEARCH_API_KEY missing"

            exit 1

          fi


          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then

            echo "❌ AZURE_OPENAI_ENDPOINT missing"

            exit 1

          fi


          if [ -z "$AZURE_OPENAI_API_KEY" ]; then

            echo "❌ AZURE_OPENAI_API_KEY missing"

            exit 1

          fi


          if [ -z "$AZURE_OPENAI_DEPLOYMENT" ]; then

            echo "❌ AZURE_OPENAI_DEPLOYMENT missing"

            exit 1

          fi


          echo "✅ Azure configuration present"


      # ------------------------------------------------------
      # Run AI Reviewer
      # ------------------------------------------------------

      - name: Run Terraform AI Reviewer

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          set -o pipefail


          echo "=========================================="

          echo "Running Terraform AI Reviewer"

          echo "=========================================="


          echo ""

          echo "Plan:"

          ls -lh parent_module/tfplan.json


          echo ""

          echo "Executing agent.py..."



          # IMPORTANT:
          # stdout/stderr are captured separately.
          # This makes debugging much easier.

          python agent/agent.py parent_module/tfplan.json \
            > ai-review-output.txt \
            2> ai-review-error.log


          EXIT_CODE=$?


          echo ""

          echo "Agent Exit Code: $EXIT_CODE"


          echo ""

          echo "=========================================="

          echo "Agent STDOUT"

          echo "=========================================="


          cat ai-review-output.txt || true


          echo ""

          echo "=========================================="

          echo "Agent STDERR"

          echo "=========================================="


          cat ai-review-error.log || true


          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""

            echo "=========================================="

            echo "❌ AI Reviewer Failed"

            echo "=========================================="


            echo ""

            echo "STDERR:"

            cat ai-review-error.log || true


            echo ""

            echo "STDOUT:"

            cat ai-review-output.txt || true


            exit "$EXIT_CODE"

          fi


          echo ""

          echo "✅ AI Reviewer completed successfully"



      # ------------------------------------------------------
      # Extract JSON from AI Output
      #
      # This protects against debug/log lines printed
      # before or after JSON.
      # ------------------------------------------------------

      - name: Prepare AI Review JSON

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          output = Path("ai-review-output.txt").read_text().strip()


          print("AI output length:", len(output))


          # Try complete output first

          try:

              data = json.loads(output)

          except json.JSONDecodeError:

              # Find JSON object inside logs

              start = output.find("{")

              end = output.rfind("}")


              if start == -1 or end == -1 or end <= start:

                  print("❌ Could not find JSON object in AI output")

                  print(output)

                  raise SystemExit(1)


              json_text = output[start:end + 1]

              data = json.loads(json_text)


          Path("ai-review.json").write_text(

              json.dumps(

                  data,

                  indent=2

              )

          )


          print("✅ ai-review.json created")

          print(

              json.dumps(

                  data,

                  indent=2

              )

          )

          PY



      # ------------------------------------------------------
      # Validate AI JSON
      # ------------------------------------------------------

      - name: Validate AI Review JSON

        run: |

          python - <<'PY'

          import json


          with open("ai-review.json") as f:

              data = json.load(f)


          print("==========================================")

          print("AI Review JSON Validation")

          print("==========================================")


          print("✅ Valid JSON")

          print("")

          print("Risk Level:", data.get("risk_level", "UNKNOWN"))

          print("Risk Score:", data.get("risk_score", 0))

          print("Decision:", data.get("decision", "UNKNOWN"))

          print("")

          print("Security Signals:")

          print(data.get("security_signals", []))

          PY



      # ------------------------------------------------------
      # Display Final AI Review
      # ------------------------------------------------------

      - name: Display AI Review

        run: |

          echo "=========================================="

          echo "Final AI Review"

          echo "=========================================="


          cat ai-review.json



      # ------------------------------------------------------
      # Extract Risk Information
      # ------------------------------------------------------

      - name: Extract Risk Information

        id: risk

        run: |

          RISK_LEVEL=$(python -c '

          import json

          with open("ai-review.json") as f:

              data = json.load(f)

          print(data.get("risk_level", "UNKNOWN"))

          ')


          RISK_SCORE=$(python -c '

          import json

          with open("ai-review.json") as f:

              data = json.load(f)

          print(data.get("risk_score", 0))

          ')


          DECISION=$(python -c '

          import json

          with open("ai-review.json") as f:

              data = json.load(f)

          print(data.get("decision", "UNKNOWN"))

          ')


          echo "Risk Level: $RISK_LEVEL"

          echo "Risk Score: $RISK_SCORE"

          echo "Decision: $DECISION"


          echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

          echo "risk_score=$RISK_SCORE" >> "$GITHUB_OUTPUT"

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"



      # ------------------------------------------------------
      # Create PR Comment
      # ------------------------------------------------------

      - name: Create AI Review Report

        run: |

          python - <<'PY'

          import json


          with open("ai-review.json") as f:

              data = json.load(f)


          risk_level = data.get(

              "risk_level",

              "UNKNOWN"

          )


          risk_score = data.get(

              "risk_score",

              0

          )


          destroy_count = data.get(

              "destroy_count",

              0

          )


          create_count = data.get(

              "create_count",

              0

          )


          update_count = data.get(

              "update_count",

              0

          )


          signals = data.get(

              "security_signals",

              []

          )


          llm_review = data.get(

              "llm_review",

              {}

          )


          summary = llm_review.get(

              "summary",

              "No LLM summary available."

          )


          recommendations = llm_review.get(

              "recommendations",

              []

          )


          with open(

              "pr-comment.md",

              "w"

          ) as f:


              f.write(

                  "# 🤖 Terraform AI Security Review\n\n"

              )


              f.write(

                  f"## Risk: **{risk_level}** "

                  f"({risk_score}/100)\n\n"

              )


              f.write(

                  "### Terraform Changes\n\n"

              )


              f.write(

                  f"- ➕ Create: **{create_count}**\n"

              )


              f.write(

                  f"- 🔄 Update: **{update_count}**\n"

              )


              f.write(

                  f"- 🗑️ Destroy: **{destroy_count}**\n\n"

              )


              f.write(

                  "### Security Signals\n\n"

              )


              if signals:


                  for signal in signals:


                      f.write(

                          f"- **{signal.get('type')}** — "

                          f"{signal.get('severity')} — "

                          f"{signal.get('reason')}  \n"

                      )


              else:


                  f.write(

                      "No security signals detected.  \n"

                  )


              f.write(

                  "\n### AI Assessment\n\n"

              )


              f.write(summary)


              f.write(

                  "\n\n### Recommendations\n\n"

              )


              if recommendations:


                  for recommendation in recommendations:


                      f.write(

                          f"- {recommendation}\n"

                      )


              else:


                  f.write(

                      "- No additional recommendations.\n"

                  )


              f.write(

                  "\n---\n"

                  "Generated by Terraform AI Security Reviewer."

              )

          PY



      # ------------------------------------------------------
      # Comment on Pull Request
      # ------------------------------------------------------

      - name: Comment on Pull Request

        if: github.event_name == 'pull_request'

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          gh pr comment \
            "${{ github.event.pull_request.number }}" \
            --body-file pr-comment.md



      # ------------------------------------------------------
      # AI Security Gate
      # ------------------------------------------------------

      - name: Enforce AI Security Gate

        run: |

          RISK_LEVEL="${{ steps.risk.outputs.risk_level }}"


          echo "=========================================="

          echo "AI Security Gate"

          echo "=========================================="


          echo "Risk Level: $RISK_LEVEL"


          if [ "$RISK_LEVEL" = "HIGH" ]; then


            echo ""

            echo "🚨 HIGH RISK DETECTED"

            echo ""

            echo "Terraform deployment blocked."

            echo "Manual security review required."


            exit 1


          fi


          if [ "$RISK_LEVEL" = "MEDIUM" ]; then


            echo ""

            echo "⚠️ MEDIUM RISK"

            echo "Review recommended."

            echo "Pipeline will continue."


          fi


          if [ "$RISK_LEVEL" = "LOW" ]; then


            echo ""

            echo "✅ LOW RISK"

            echo "Pipeline can continue."


          fi



      # ------------------------------------------------------
      # Upload AI Review
      # ------------------------------------------------------

      - name: Upload AI Review

        uses: actions/upload-artifact@v4

        with:

          name: terraform-ai-review

          path: |

            ai-review.json

            ai-review-output.txt

            ai-review-error.log

            pr-comment.md



  # ==========================================================
  # Stage 4 - Terraform Apply
  # ==========================================================

  apply:

    name: Terraform Apply

    needs:

      - ai-review


    # Apply only after merge/push to main

    if: >

      github.event_name == 'push' &&

      github.ref == 'refs/heads/main'


    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # Production Environment Approval
    #
    # Configure:
    #
    # Repository
    # → Settings
    # → Environments
    # → production
    # → Required reviewers
    # --------------------------------------------------------

    environment:

      name: production


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply

        working-directory: parent_module

        run: |

          terraform apply -auto-approve