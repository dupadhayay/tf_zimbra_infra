name: Terraform AI Security Review

on:

  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:

  id-token: write
  contents: read
  pull-requests: write


# ============================================================
# Stage 1 - Security Scan
# ============================================================

jobs:

  security-scan:

    name: Terraform Security Scan

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      - name: Terraform Version

        run: |

          terraform version


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check

        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate

        working-directory: parent_module

        run: |

          terraform validate


      # ======================================================
      # Gitleaks
      # ======================================================

      - name: Install Gitleaks

        run: |

          sudo apt-get update

          sudo apt-get install -y gitleaks


      - name: Run Gitleaks

        run: |

          gitleaks detect \
            --source . \
            --exit-code 1


      # ======================================================
      # TruffleHog
      # ======================================================

      - name: Install TruffleHog

        run: |

          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin


      - name: Run TruffleHog

        run: |

          trufflehog filesystem . --json > trufflehog-report.json


      # ======================================================
      # TFLint
      # ======================================================

      - name: Install TFLint

        run: |

          curl -s \
            https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh \
            | bash


      - name: Run TFLint

        working-directory: parent_module

        run: |

          tflint --init

          tflint


      # ======================================================
      # tfsec
      # ======================================================

      - name: Install tfsec

        run: |

          curl -s \
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | bash


      - name: Run tfsec

        working-directory: parent_module

        run: |

          tfsec .


  # ==========================================================
  # Stage 2 - Terraform Plan
  # ==========================================================

  plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - security-scan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Azure Account Diagnostics
      # ------------------------------------------------------

      - name: Azure Account Diagnostics

        run: |

          echo "=========================================="
          echo "Azure Account Diagnostics"
          echo "=========================================="

          az account show \
            --query "{subscription:id,tenant:tenantId,user:user.name}" \
            --output table

          echo ""

          echo "Azure CLI version:"
          az version --output table


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan

        working-directory: parent_module

        run: |

          terraform plan -out=tfplan


      # ------------------------------------------------------
      # Terraform Plan JSON
      # ------------------------------------------------------

      - name: Terraform Show JSON

        working-directory: parent_module

        run: |

          terraform show -json tfplan > tfplan.json


      # ------------------------------------------------------
      # Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="
          echo "Terraform Plan Verification"
          echo "=========================================="

          ls -lh parent_module/tfplan

          ls -lh parent_module/tfplan.json

          test -f parent_module/tfplan

          test -f parent_module/tfplan.json

          echo ""

          echo "Terraform plan generated successfully"


      # ------------------------------------------------------
      # Upload Terraform Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan

          path: |

            parent_module/tfplan

            parent_module/tfplan.json


  # ==========================================================
  # Stage 3 - AI Terraform Security Review
  # ==========================================================

  ai-review:

    name: AI Terraform Security Review

    runs-on: ubuntu-latest

    timeout-minutes: 25

    needs:

      - plan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ------------------------------------------------------
      # Python Dependencies
      # ------------------------------------------------------

      - name: Install Python Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r agent/requirements.txt


      # ------------------------------------------------------
      # Download Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan

          path: parent_module


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="
          echo "Terraform Plan Verification"
          echo "=========================================="

          ls -lh parent_module/

          test -f parent_module/tfplan

          test -f parent_module/tfplan.json

          echo ""

          echo "tfplan found successfully"

          echo "tfplan.json found successfully"


      # ------------------------------------------------------
      # Verify AI Agent
      # ------------------------------------------------------

      - name: Verify AI Agent

        run: |

          echo "=========================================="
          echo "AI Agent Verification"
          echo "=========================================="

          echo ""

          ls -lh agent/

          echo ""

          test -f agent/agent.py

          echo "agent.py found"

          echo ""

          python --version


      # ------------------------------------------------------
      # Verify Python Packages
      # ------------------------------------------------------

      - name: Verify Python Packages

        run: |

          echo "=========================================="
          echo "Python Package Verification"
          echo "=========================================="

          python -c "

          import openai
          import azure.core
          import azure.search.documents
          import azure.search.documents.indexes

          print('openai import OK')
          print('azure.core import OK')
          print('azure.search.documents import OK')
          print('azure.search.documents.indexes import OK')

          "


      # ======================================================
      # Azure Configuration
      # ======================================================

      - name: Verify Azure Configuration

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "Azure Configuration"
          echo "=========================================="

          echo ""

          if [ -z "$AZURE_SEARCH_ENDPOINT" ]; then
            echo "AZURE_SEARCH_ENDPOINT missing"
            exit 1
          fi

          if [ -z "$AZURE_SEARCH_API_KEY" ]; then
            echo "AZURE_SEARCH_API_KEY missing"
            exit 1
          fi

          if [ -z "$AZURE_SEARCH_INDEX" ]; then
            echo "AZURE_SEARCH_INDEX missing"
            exit 1
          fi

          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
            echo "AZURE_OPENAI_ENDPOINT missing"
            exit 1
          fi

          if [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "AZURE_OPENAI_API_KEY missing"
            exit 1
          fi

          if [ -z "$AZURE_OPENAI_DEPLOYMENT" ]; then
            echo "AZURE_OPENAI_DEPLOYMENT missing"
            exit 1
          fi

          echo "Azure Search Endpoint configured"

          echo "Azure Search API Key configured"

          echo "Azure Search Index configured"

          echo "Azure OpenAI Endpoint configured"

          echo "Azure OpenAI API Key configured"

          echo "Azure OpenAI Deployment configured"

          echo ""

          echo "Azure configuration present"


      # ======================================================
      # DIAGNOSTIC 1
      # Azure Search Endpoint Format
      # ======================================================

      - name: Diagnostic - Azure Search Endpoint

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure AI Search Endpoint"
          echo "=========================================="

          echo ""

          echo "Endpoint:"
          echo "$AZURE_SEARCH_ENDPOINT"

          echo ""

          echo "Index:"
          echo "$AZURE_SEARCH_INDEX"

          echo ""

          python - <<'PY'

          import os
          from urllib.parse import urlparse

          endpoint = os.environ["AZURE_SEARCH_ENDPOINT"]

          index_name = os.environ["AZURE_SEARCH_INDEX"]

          print("Parsing endpoint...")

          parsed = urlparse(endpoint)

          print("Scheme :", parsed.scheme)
          print("Host   :", parsed.hostname)
          print("Path   :", parsed.path)

          print("")

          if parsed.scheme != "https":
              print("WARNING: Endpoint should normally use HTTPS")

          if not parsed.hostname:
              print("ERROR: Endpoint hostname missing")
              raise SystemExit(1)

          if parsed.path not in ("", "/"):
              print("")
              print("WARNING:")
              print("Azure Search endpoint normally should be:")
              print("https://<service-name>.search.windows.net")
              print("")
              print("Current endpoint contains a path:")
              print(parsed.path)

          if "/" in index_name:
              print("")
              print("WARNING: Search index name contains '/'")

          print("")
          print("Endpoint format diagnostic completed.")

          PY


      # ======================================================
      # DIAGNOSTIC 2
      # Azure Search DNS / Network
      # ======================================================

      - name: Diagnostic - Azure Search Network

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure Search Network"
          echo "=========================================="

          SEARCH_HOST=$(python -c "

          from urllib.parse import urlparse

          import os

          print(
              urlparse(
                  os.environ['AZURE_SEARCH_ENDPOINT']
              ).hostname
          )

          ")

          echo ""

          echo "Search Host:"
          echo "$SEARCH_HOST"

          echo ""

          echo "DNS lookup:"

          getent hosts "$SEARCH_HOST" || true

          echo ""

          echo "Testing HTTPS connectivity..."

          set +e

          curl \
            --silent \
            --show-error \
            --location \
            --max-time 15 \
            --connect-timeout 10 \
            -o /tmp/search-response.txt \
            -w "HTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\nTIME_TOTAL=%{time_total}\n" \
            "$AZURE_SEARCH_ENDPOINT"

          CURL_EXIT=$?

          set -e

          echo ""

          echo "curl exit code: $CURL_EXIT"

          echo ""

          echo "Response body preview:"

          head -c 1000 /tmp/search-response.txt || true

          echo ""

          if [ "$CURL_EXIT" -ne 0 ]; then

            echo "WARNING: HTTPS connectivity test failed."

          else

            echo "Azure Search endpoint is reachable."

          fi


      # ======================================================
      # DIAGNOSTIC 3
      # Azure Search List Indexes
      #
      # This is VERY important for 404.
      #
      # If the configured index does not exist,
      # SearchClient.search() returns ResourceNotFoundError.
      # ======================================================

      - name: Diagnostic - Azure Search List Indexes

        timeout-minutes: 5

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure Search Indexes"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.core.exceptions import (
              HttpResponseError,
              ResourceNotFoundError
          )

          from azure.search.documents.indexes import SearchIndexClient


          endpoint = os.environ["AZURE_SEARCH_ENDPOINT"]

          api_key = os.environ["AZURE_SEARCH_API_KEY"]

          expected_index = os.environ["AZURE_SEARCH_INDEX"]


          print("Creating SearchIndexClient...")

          client = SearchIndexClient(

              endpoint=endpoint,

              credential=AzureKeyCredential(api_key)

          )


          print("")

          print("Listing Azure AI Search indexes...")

          try:

              indexes = list(client.list_indexes())

              print("")

              print("Index count:", len(indexes))

              print("")

              if not indexes:

                  print("WARNING: No indexes found.")

              else:

                  for index in indexes:

                      print(
                          "INDEX:",
                          index.name
                      )

              print("")

              names = [
                  index.name
                  for index in indexes
              ]

              print(
                  "Expected index:",
                  expected_index
              )

              print("")

              if expected_index in names:

                  print(
                      "SUCCESS: Expected index exists."
                  )

              else:

                  print(
                      "ERROR: Expected index does NOT exist."
                  )

                  print("")

                  print(
                      "Expected:",
                      expected_index
                  )

                  print(
                      "Available:",
                      names
                  )

                  raise SystemExit(2)


          except ResourceNotFoundError as error:

              print("")
              print("RESOURCE NOT FOUND")
              print("")
              print(error)
              print("")

              print(
                  "Possible cause:"
              )

              print(
                  "Azure Search endpoint is incorrect,"
                  " service does not exist,"
                  " or API request is targeting wrong resource."
              )

              raise


          except HttpResponseError as error:

              print("")
              print("HTTP ERROR")
              print("")
              print("Status:", error.status_code)
              print("Message:", error.message)

              raise


          PY


      # ======================================================
      # DIAGNOSTIC 4
      # Azure Search Get Specific Index
      # ======================================================

      - name: Diagnostic - Azure Search Get Index

        timeout-minutes: 5

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure Search Get Index"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.core.exceptions import (
              HttpResponseError,
              ResourceNotFoundError
          )

          from azure.search.documents.indexes import SearchIndexClient


          endpoint = os.environ["AZURE_SEARCH_ENDPOINT"]

          api_key = os.environ["AZURE_SEARCH_API_KEY"]

          index_name = os.environ["AZURE_SEARCH_INDEX"]


          print("Endpoint:", endpoint)

          print("Index:", index_name)

          print("")


          client = SearchIndexClient(

              endpoint=endpoint,

              credential=AzureKeyCredential(api_key)

          )


          try:

              print(
                  "Calling get_index()..."
              )

              index = client.get_index(
                  index_name
              )

              print("")

              print(
                  "SUCCESS: Index found."
              )

              print(
                  "Index name:",
                  index.name
              )

              print(
                  "Fields:"
              )

              for field in index.fields:

                  print(
                      "-",
                      field.name,
                      "|",
                      field.type
                  )


          except ResourceNotFoundError as error:

              print("")
              print("ERROR: Search index not found.")
              print("")
              print("This is the likely cause of the 404.")
              print("")
              print("Configured index:")
              print(index_name)
              print("")
              print("Azure error:")
              print(error)

              raise


          except HttpResponseError as error:

              print("")
              print("Azure Search HTTP error")
              print("")
              print("Status:", error.status_code)
              print("Message:", error.message)

              raise


          PY


      # ======================================================
      # DIAGNOSTIC 5
      # Azure Search SearchClient Test
      # ======================================================

      - name: Diagnostic - Azure Search Query

        timeout-minutes: 5

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure Search Query"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.core.exceptions import (
              HttpResponseError,
              ResourceNotFoundError
          )

          from azure.search.documents import SearchClient


          endpoint = os.environ["AZURE_SEARCH_ENDPOINT"]

          api_key = os.environ["AZURE_SEARCH_API_KEY"]

          index_name = os.environ["AZURE_SEARCH_INDEX"]


          print("Creating SearchClient...")

          client = SearchClient(

              endpoint=endpoint,

              index_name=index_name,

              credential=AzureKeyCredential(api_key)

          )


          try:

              print("")
              print("Executing search...")
              print("")

              results = client.search(

                  search_text="terraform",

                  top=1

              )


              count = 0

              for result in results:

                  count += 1

                  print(
                      "Document:",
                      result
                  )

                  if count >= 1:

                      break


              print("")

              print(
                  "Search request completed."
              )

              print(
                  "Documents returned:",
                  count
              )

              print("")

              if count == 0:

                  print(
                      "WARNING: Search worked but "
                      "no documents were returned."
                  )

              else:

                  print(
                      "SUCCESS: Search returned documents."
                  )


          except ResourceNotFoundError as error:

              print("")
              print("================================")
              print("404 RESOURCE NOT FOUND")
              print("================================")
              print("")
              print(error)
              print("")
              print(
                  "This confirms that the SearchClient "
                  "cannot find the configured index/resource."
              )

              raise


          except HttpResponseError as error:

              print("")
              print("================================")
              print("AZURE SEARCH HTTP ERROR")
              print("================================")
              print("")
              print("Status:", error.status_code)
              print("Message:", error.message)

              raise


          PY


      # ======================================================
      # DIAGNOSTIC 6
      # Azure Search Document Count
      # ======================================================

      - name: Diagnostic - Azure Search Document Count

        timeout-minutes: 5

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure Search Document Count"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.search.documents import SearchClient


          endpoint = os.environ["AZURE_SEARCH_ENDPOINT"]

          api_key = os.environ["AZURE_SEARCH_API_KEY"]

          index_name = os.environ["AZURE_SEARCH_INDEX"]


          client = SearchClient(

              endpoint=endpoint,

              index_name=index_name,

              credential=AzureKeyCredential(api_key)

          )


          try:

              count = client.get_document_count()

              print("")

              print(
                  "Azure Search document count:",
                  count
              )

              print("")

              if count == 0:

                  print(
                      "WARNING: Index exists but contains zero documents."
                  )

              else:

                  print(
                      "SUCCESS: Index contains documents."
                  )


          except Exception as error:

              print("")
              print(
                  "Document count request failed."
              )

              print(
                  type(error).__name__
              )

              print(
                  str(error)
              )

              raise


          PY


      # ======================================================
      # DIAGNOSTIC 7
      # Azure OpenAI Endpoint Format
      # ======================================================

      - name: Diagnostic - Azure OpenAI Endpoint

        env:

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure OpenAI Endpoint"
          echo "=========================================="

          echo ""

          echo "OpenAI Endpoint:"
          echo "$AZURE_OPENAI_ENDPOINT"

          echo ""

          echo "Deployment:"
          echo "$AZURE_OPENAI_DEPLOYMENT"

          echo ""

          python - <<'PY'

          import os

          from urllib.parse import urlparse


          endpoint = os.environ["AZURE_OPENAI_ENDPOINT"]

          deployment = os.environ["AZURE_OPENAI_DEPLOYMENT"]


          parsed = urlparse(endpoint)


          print("Scheme :", parsed.scheme)

          print("Host   :", parsed.hostname)

          print("Path   :", parsed.path)


          print("")


          if parsed.scheme != "https":

              print(
                  "WARNING: Azure OpenAI endpoint should use HTTPS."
              )


          if not parsed.hostname:

              print(
                  "ERROR: Azure OpenAI hostname missing."
              )

              raise SystemExit(1)


          if "/openai/" in parsed.path:

              print("")

              print(
                  "WARNING: Endpoint appears to contain "
                  "an OpenAI API path."
              )

              print(
                  "For AzureOpenAI SDK, normally use only:"
              )

              print(
                  "https://<resource>.openai.azure.com/"
              )


          print("")

          print(
              "Deployment configured:",
              deployment
          )

          print("")

          print(
              "Azure OpenAI endpoint diagnostic completed."
          )

          PY


      # ======================================================
      # DIAGNOSTIC 8
      # Azure OpenAI Network
      # ======================================================

      - name: Diagnostic - Azure OpenAI Network

        env:

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure OpenAI Network"
          echo "=========================================="

          OPENAI_HOST=$(python -c "

          from urllib.parse import urlparse

          import os

          print(
              urlparse(
                  os.environ['AZURE_OPENAI_ENDPOINT']
              ).hostname
          )

          ")

          echo ""

          echo "OpenAI Host:"
          echo "$OPENAI_HOST"

          echo ""

          echo "DNS lookup:"

          getent hosts "$OPENAI_HOST" || true

          echo ""

          echo "HTTPS connectivity test:"

          set +e

          curl \
            --silent \
            --show-error \
            --location \
            --max-time 15 \
            --connect-timeout 10 \
            -o /tmp/openai-response.txt \
            -w "HTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\nTIME_TOTAL=%{time_total}\n" \
            "$AZURE_OPENAI_ENDPOINT"

          CURL_EXIT=$?

          set -e

          echo ""

          echo "curl exit code: $CURL_EXIT"

          echo ""

          echo "Response preview:"

          head -c 1000 /tmp/openai-response.txt || true

          echo ""

          if [ "$CURL_EXIT" -eq 0 ]; then

            echo "Azure OpenAI endpoint is reachable."

          else

            echo "WARNING: Azure OpenAI connectivity failed."

          fi


      # ======================================================
      # DIAGNOSTIC 9
      # Azure OpenAI API Call
      # ======================================================

      - name: Diagnostic - Azure OpenAI API

        timeout-minutes: 5

        env:

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Azure OpenAI API"
          echo "=========================================="

          python - <<'PY'

          import os

          from openai import AzureOpenAI

          from openai import APIConnectionError

          from openai import APIStatusError


          endpoint = os.environ["AZURE_OPENAI_ENDPOINT"]

          api_key = os.environ["AZURE_OPENAI_API_KEY"]

          deployment = os.environ["AZURE_OPENAI_DEPLOYMENT"]


          print("Creating Azure OpenAI client...")

          client = AzureOpenAI(

              azure_endpoint=endpoint,

              api_key=api_key,

              api_version="2024-10-21"

          )


          try:

              print("")

              print(
                  "Calling deployment:",
                  deployment
              )

              print("")


              response = client.chat.completions.create(

                  model=deployment,

                  messages=[

                      {

                          "role": "user",

                          "content": "Reply with exactly OK"

                      }

                  ],

                  max_tokens=5,

                  temperature=0,

                  timeout=30

              )


              print("")

              print(
                  "Azure OpenAI response received."
              )

              print("")

              print(
                  "Response:",
                  response.choices[0].message.content
              )

              print("")

              print(
                  "SUCCESS: Azure OpenAI API working."
              )


          except APIStatusError as error:

              print("")

              print(
                  "Azure OpenAI API Status Error"
              )

              print("")

              print(
                  "Status:",
                  error.status_code
              )

              print(
                  "Error:",
                  error
              )

              print("")

              print(
                  "Possible causes:"
              )

              print(
                  "1. Wrong deployment name"
              )

              print(
                  "2. Wrong endpoint"
              )

              print(
                  "3. Invalid API key"
              )

              print(
                  "4. Wrong API version"
              )

              print(
                  "5. Deployment does not exist"
              )

              raise


          except APIConnectionError as error:

              print("")

              print(
                  "Azure OpenAI Connection Error"
              )

              print("")

              print(error)

              raise


          PY


      # ======================================================
      # Environment Diagnostic
      # ======================================================

      - name: Diagnostic - Python Environment

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC - Python Environment"
          echo "=========================================="

          python --version

          echo ""

          python -m pip --version

          echo ""

          echo "Installed Azure packages:"

          python -m pip list | grep -Ei \
            "azure|openai" || true

          echo ""

          echo "Python executable:"

          which python


      # ======================================================
      # Run Terraform AI Reviewer
      # ======================================================

      - name: Run Terraform AI Reviewer

        timeout-minutes: 15

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "Running Terraform AI Reviewer"
          echo "=========================================="

          echo ""

          echo "Plan:"

          ls -lh parent_module/tfplan.json

          echo ""

          echo "Executing agent.py..."

          echo ""

          echo "AI Reviewer hard timeout: 15 minutes"

          set +e

          timeout \
            --signal=TERM \
            --kill-after=30s \
            15m \
            python -u agent/agent.py parent_module/tfplan.json \
            > ai-review-output.txt \
            2> ai-review-error.log

          EXIT_CODE=$?

          set -e

          echo ""

          echo "Agent Exit Code: $EXIT_CODE"

          echo ""

          echo "=========================================="
          echo "Agent STDOUT"
          echo "=========================================="

          cat ai-review-output.txt || true

          echo ""

          echo "=========================================="
          echo "Agent STDERR"
          echo "=========================================="

          cat ai-review-error.log || true


          # --------------------------------------------------
          # Timeout
          # --------------------------------------------------

          if [ "$EXIT_CODE" -eq 124 ]; then

            echo ""

            echo "=========================================="
            echo "AI Reviewer Timeout"
            echo "=========================================="

            echo ""

            echo "agent.py exceeded 15 minutes."

            exit 124

          fi


          # --------------------------------------------------
          # Process terminated
          # --------------------------------------------------

          if [ "$EXIT_CODE" -eq 143 ] || [ "$EXIT_CODE" -eq 137 ]; then

            echo ""

            echo "=========================================="
            echo "AI Reviewer Process Terminated"
            echo "=========================================="

            echo ""

            echo "Exit Code: $EXIT_CODE"

            exit "$EXIT_CODE"

          fi


          # --------------------------------------------------
          # Normal failure
          # --------------------------------------------------

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""

            echo "=========================================="
            echo "AI Reviewer Failed"
            echo "=========================================="

            echo ""

            echo "Exit Code: $EXIT_CODE"

            echo ""

            echo "STDERR:"

            cat ai-review-error.log || true

            echo ""

            echo "STDOUT:"

            cat ai-review-output.txt || true

            exit "$EXIT_CODE"

          fi


          echo ""

          echo "=========================================="
          echo "AI Reviewer Completed Successfully"
          echo "=========================================="


      # ======================================================
      # Prepare AI Review JSON
      # ======================================================

      - name: Prepare AI Review JSON

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          output_file = Path(
              "ai-review-output.txt"
          )


          if not output_file.exists():

              print(
                  "AI output file not found"
              )

              raise SystemExit(1)


          output = output_file.read_text(
              errors="replace"
          ).strip()


          print(
              "AI output length:",
              len(output)
          )


          if not output:

              print(
                  "AI reviewer returned empty output"
              )

              raise SystemExit(1)


          try:

              data = json.loads(output)


          except json.JSONDecodeError:

              print(
                  "Direct JSON parsing failed."
              )

              print(
                  "Trying to extract JSON object..."
              )


              start = output.find("{")

              end = output.rfind("}")


              if (

                  start == -1

                  or end == -1

                  or end <= start

              ):

                  print(
                      "Could not find JSON object"
                  )

                  print(output)

                  raise SystemExit(1)


              json_text = output[
                  start:end + 1
              ]


              try:

                  data = json.loads(
                      json_text
                  )


              except json.JSONDecodeError as error:

                  print(
                      "Extracted JSON is invalid"
                  )

                  print(error)

                  print(json_text)

                  raise SystemExit(1)


          Path(
              "ai-review.json"
          ).write_text(

              json.dumps(
                  data,
                  indent=2
              )

          )


          print("")

          print(
              "ai-review.json created successfully"
          )

          print("")

          print(
              json.dumps(
                  data,
                  indent=2
              )
          )

          PY


      # ======================================================
      # Validate AI Review JSON
      # ======================================================

      - name: Validate AI Review JSON

        run: |

          python - <<'PY'

          import json


          with open(
              "ai-review.json"
          ) as f:

              data = json.load(f)


          print(
              "=========================================="
          )

          print(
              "AI Review JSON Validation"
          )

          print(
              "=========================================="
          )


