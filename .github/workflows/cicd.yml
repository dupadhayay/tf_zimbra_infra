name: Terraform AI Security Review

on:

  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:

  id-token: write

  contents: read

  pull-requests: write


# ============================================================
# Stage 1 - Security Scan
# ============================================================

jobs:

  security-scan:

    name: Terraform Security Scan

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      - name: Terraform Version

        run: |

          terraform version


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check

        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate

        working-directory: parent_module

        run: |

          terraform validate


      # ======================================================
      # Gitleaks
      # ======================================================

      - name: Install Gitleaks

        run: |

          sudo apt-get update

          sudo apt-get install -y gitleaks


      - name: Run Gitleaks

        run: |

          gitleaks detect \
            --source . \
            --exit-code 1


      # ======================================================
      # TruffleHog
      # ======================================================

      - name: Install TruffleHog

        run: |

          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin


      - name: Run TruffleHog

        run: |

          trufflehog filesystem . --json > trufflehog-report.json


      # ======================================================
      # TFLint
      # ======================================================

      - name: Install TFLint

        run: |

          curl -s \
            https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh \
            | bash


      - name: Run TFLint

        working-directory: parent_module

        run: |

          tflint --init

          tflint


      # ======================================================
      # tfsec
      # ======================================================

      - name: Install tfsec

        run: |

          curl -s \
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | bash


      - name: Run tfsec

        working-directory: parent_module

        run: |

          tfsec .


  # ==========================================================
  # Stage 2 - Terraform Plan
  # ==========================================================

  plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - security-scan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan

        working-directory: parent_module

        run: |

          terraform plan -out=tfplan


      # ------------------------------------------------------
      # Terraform Plan JSON
      # ------------------------------------------------------

      - name: Terraform Show JSON

        working-directory: parent_module

        run: |

          terraform show -json tfplan > tfplan.json


      # ------------------------------------------------------
      # Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="

          echo "Terraform Plan Verification"

          echo "=========================================="


          ls -lh parent_module/tfplan

          ls -lh parent_module/tfplan.json


          test -f parent_module/tfplan

          test -f parent_module/tfplan.json


          echo ""

          echo "Terraform plan generated successfully"


      # ------------------------------------------------------
      # Upload Terraform Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan

          path: |

            parent_module/tfplan

            parent_module/tfplan.json


  # ==========================================================
  # Stage 3 - AI Terraform Security Review
  # ==========================================================

  ai-review:

    name: AI Terraform Security Review

    runs-on: ubuntu-latest

    timeout-minutes: 20

    needs:

      - plan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ------------------------------------------------------
      # Python Dependencies
      # ------------------------------------------------------

      - name: Install Python Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r agent/requirements.txt


      # ------------------------------------------------------
      # Download Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan

          path: parent_module


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="

          echo "Terraform Plan Verification"

          echo "=========================================="


          ls -lh parent_module/


          test -f parent_module/tfplan.json


          echo ""

          echo "tfplan.json found successfully"


      # ------------------------------------------------------
      # Verify AI Agent
      # ------------------------------------------------------

      - name: Verify AI Agent

        run: |

          echo "=========================================="

          echo "AI Agent Verification"

          echo "=========================================="


          echo ""

          ls -lh agent/


          echo ""

          test -f agent/agent.py


          echo "agent.py found"


          echo ""

          python --version


      # ------------------------------------------------------
      # Verify Python Packages
      # ------------------------------------------------------

      - name: Verify Python Packages

        run: |

          echo "=========================================="

          echo "Python Package Verification"

          echo "=========================================="


          python -c "

          import openai

          import azure.core

          import azure.search.documents


          print('openai import OK')

          print('azure.core import OK')

          print('azure.search.documents import OK')

          "


      # ------------------------------------------------------
      # Verify Azure Configuration
      # ------------------------------------------------------

      - name: Verify Azure Configuration

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="

          echo "Azure Configuration"

          echo "=========================================="


          if [ -z "$AZURE_SEARCH_ENDPOINT" ]; then

            echo "AZURE_SEARCH_ENDPOINT missing"

            exit 1

          fi


          if [ -z "$AZURE_SEARCH_API_KEY" ]; then

            echo "AZURE_SEARCH_API_KEY missing"

            exit 1

          fi


          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then

            echo "AZURE_OPENAI_ENDPOINT missing"

            exit 1

          fi


          if [ -z "$AZURE_OPENAI_API_KEY" ]; then

            echo "AZURE_OPENAI_API_KEY missing"

            exit 1

          fi


          if [ -z "$AZURE_OPENAI_DEPLOYMENT" ]; then

            echo "AZURE_OPENAI_DEPLOYMENT missing"

            exit 1

          fi


          echo ""

          echo "Azure configuration present"


      # ======================================================
      # Run Terraform AI Reviewer
      # ======================================================

      - name: Run Terraform AI Reviewer

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="

          echo "Running Terraform AI Reviewer"

          echo "=========================================="


          echo ""

          echo "Plan:"

          ls -lh parent_module/tfplan.json


          echo ""

          echo "Executing agent.py..."


          echo ""

          echo "AI Reviewer hard timeout: 15 minutes"


          # --------------------------------------------------
          # IMPORTANT
          #
          # GitHub Actions runs bash with -e.
          #
          # If timeout returns 124, bash would normally stop
          # immediately before EXIT_CODE=$? executes.
          #
          # Therefore temporarily disable -e.
          # --------------------------------------------------

          set +e


          timeout --signal=TERM --kill-after=30s 15m \
            python -u agent/agent.py parent_module/tfplan.json \
            > ai-review-output.txt \
            2> ai-review-error.log


          EXIT_CODE=$?


          set -e


          echo ""

          echo "Agent Exit Code: $EXIT_CODE"


          echo ""

          echo "=========================================="

          echo "Agent STDOUT"

          echo "=========================================="


          cat ai-review-output.txt || true


          echo ""

          echo "=========================================="

          echo "Agent STDERR"

          echo "=========================================="


          cat ai-review-error.log || true


          # --------------------------------------------------
          # Timeout
          # --------------------------------------------------

          if [ "$EXIT_CODE" -eq 124 ]; then

            echo ""

            echo "=========================================="

            echo "AI Reviewer Timeout"

            echo "=========================================="


            echo ""

            echo "agent.py exceeded the 15 minute timeout."


            echo ""

            echo "Possible causes:"


            echo "1. Azure AI Search request hanging"

            echo "2. Azure OpenAI request hanging"

            echo "3. Azure network connectivity"

            echo "4. Invalid Azure endpoint"

            echo "5. Azure SDK retry loop"

            echo "6. LLM deployment response delay"


            echo ""

            echo "Agent STDERR:"

            cat ai-review-error.log || true


            echo ""

            echo "Agent STDOUT:"

            cat ai-review-output.txt || true


            exit 124

          fi


          # --------------------------------------------------
          # SIGTERM / SIGKILL
          # --------------------------------------------------

          if [ "$EXIT_CODE" -eq 143 ] || [ "$EXIT_CODE" -eq 137 ]; then

            echo ""

            echo "=========================================="

            echo "AI Reviewer Process Terminated"

            echo "=========================================="


            echo "Exit Code: $EXIT_CODE"


            echo ""

            echo "Agent STDERR:"

            cat ai-review-error.log || true


            exit "$EXIT_CODE"

          fi


          # --------------------------------------------------
          # Normal Failure
          # --------------------------------------------------

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""

            echo "=========================================="

            echo "AI Reviewer Failed"

            echo "=========================================="


            echo ""

            echo "Exit Code: $EXIT_CODE"


            echo ""

            echo "STDERR:"

            cat ai-review-error.log || true


            echo ""

            echo "STDOUT:"

            cat ai-review-output.txt || true


            exit "$EXIT_CODE"

          fi


          echo ""

          echo "=========================================="

          echo "AI Reviewer Completed Successfully"

          echo "=========================================="


      # ======================================================
      # Prepare AI Review JSON
      # ======================================================

      - name: Prepare AI Review JSON

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          output_file = Path(
              "ai-review-output.txt"
          )


          if not output_file.exists():

              print("AI output file not found")

              raise SystemExit(1)


          output = output_file.read_text(
              errors="replace"
          ).strip()


          print(
              "AI output length:",
              len(output)
          )


          if not output:

              print(
                  "AI reviewer returned empty output"
              )

              raise SystemExit(1)


          # --------------------------------------------------
          # Try complete output as JSON
          # --------------------------------------------------

          try:

              data = json.loads(output)


          except json.JSONDecodeError:

              print(
                  "Direct JSON parsing failed."
              )

              print(
                  "Trying to extract JSON object..."
              )


              start = output.find("{")

              end = output.rfind("}")


              if (

                  start == -1

                  or end == -1

                  or end <= start

              ):

                  print(
                      "Could not find JSON object"
                  )

                  print(output)

                  raise SystemExit(1)


              json_text = output[
                  start:end + 1
              ]


              try:

                  data = json.loads(
                      json_text
                  )


              except json.JSONDecodeError as error:

                  print(
                      "Extracted JSON is invalid"
                  )

                  print(error)

                  print(json_text)

                  raise SystemExit(1)


          Path(
              "ai-review.json"
          ).write_text(

              json.dumps(
                  data,
                  indent=2
              )

          )


          print("")

          print(
              "ai-review.json created successfully"
          )


          print("")

          print(
              json.dumps(
                  data,
                  indent=2
              )
          )

          PY


      # ======================================================
      # Validate AI Review JSON
      # ======================================================

      - name: Validate AI Review JSON

        run: |

          python - <<'PY'

          import json


          with open(
              "ai-review.json"
          ) as f:

              data = json.load(f)


          print(
              "=========================================="
          )

          print(
              "AI Review JSON Validation"
          )

          print(
              "=========================================="
          )


          print("Valid JSON")


          print("")

          print(
              "Risk Level:",
              data.get(
                  "risk_level",
                  "UNKNOWN"
              )
          )


          print(
              "Risk Score:",
              data.get(
                  "risk_score",
                  0
              )
          )


          print(
              "Decision:",
              data.get(
                  "decision",
                  "UNKNOWN"
              )
          )


          print("")

          print(
              "Security Signals:"
          )


          signals = data.get(
              "security_signals",
              []
          )


          if signals:

              for signal in signals:

                  print(
                      "-",
                      signal
                  )

          else:

              print(
                  "No security signals detected."
              )

          PY


      # ======================================================
      # Display Final AI Review
      # ======================================================

      - name: Display AI Review

        run: |

          echo "=========================================="

          echo "Final AI Review"

          echo "=========================================="


          cat ai-review.json


      # ======================================================
      # Extract Risk Information
      # ======================================================

      - name: Extract Risk Information

        id: risk

        run: |

          RISK_LEVEL=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'risk_level',
                  'UNKNOWN'
              )
          )

          ")


          RISK_SCORE=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'risk_score',
                  0
              )
          )

          ")


          DECISION=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'decision',
                  'UNKNOWN'
              )
          )

          ")


          echo ""

          echo "Risk Level: $RISK_LEVEL"

          echo "Risk Score: $RISK_SCORE"

          echo "Decision: $DECISION"


          echo ""

          echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

          echo "risk_score=$RISK_SCORE" >> "$GITHUB_OUTPUT"

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # Create PR Comment
      # ======================================================

      - name: Create AI Review Report

        run: |

          python - <<'PY'

          import json


          with open(
              "ai-review.json"
          ) as f:

              data = json.load(f)


          risk_level = data.get(
              "risk_level",
              "UNKNOWN"
          )


          risk_score = data.get(
              "risk_score",
              0
          )


          destroy_count = data.get(
              "destroy_count",
              0
          )


          create_count = data.get(
              "create_count",
              0
          )


          update_count = data.get(
              "update_count",
              0
          )


          signals = data.get(
              "security_signals",
              []
          )


          llm_review = data.get(
              "llm_review",
              {}
          )


          summary = llm_review.get(
              "summary",
              "No LLM summary available."
          )


          recommendations = llm_review.get(
              "recommendations",
              []
          )


          with open(
              "pr-comment.md",
              "w"
          ) as f:

              f.write(
                  "# 🤖 Terraform AI Security Review\n\n"
              )


              f.write(
                  f"## Risk: **{risk_level}** "
                  f"({risk_score}/100)\n\n"
              )


              f.write(
                  "### Terraform Changes\n\n"
              )


              f.write(
                  f"- Create: **{create_count}**\n"
              )


              f.write(
                  f"- Update: **{update_count}**\n"
              )


              f.write(
                  f"- Destroy: **{destroy_count}**\n\n"
              )


              f.write(
                  "### Security Signals\n\n"
              )


              if signals:

                  for signal in signals:

                      f.write(

                          f"- **{signal.get('type', 'UNKNOWN')}** — "

                          f"{signal.get('severity', 'UNKNOWN')} — "

                          f"{signal.get('reason', 'No reason provided')}  \n"

                      )

              else:

                  f.write(
                      "No security signals detected.  \n"
                  )


              f.write(
                  "\n### AI Assessment\n\n"
              )


              f.write(
                  str(summary)
              )


              f.write(
                  "\n\n### Recommendations\n\n"
              )


              if recommendations:

                  for recommendation in recommendations:

                      f.write(
                          f"- {recommendation}\n"
                      )

              else:

                  f.write(
                      "- No additional recommendations.\n"
                  )


              f.write(
                  "\n---\n"
                  "Generated by Terraform AI Security Reviewer."
              )

          PY


      # ======================================================
      # Comment on Pull Request
      # ======================================================

      - name: Comment on Pull Request

        if: github.event_name == 'pull_request'

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          gh pr comment \
            "${{ github.event.pull_request.number }}" \
            --body-file pr-comment.md


      # ======================================================
      # AI Security Gate
      # ======================================================

      - name: Enforce AI Security Gate

        run: |

          RISK_LEVEL="${{ steps.risk.outputs.risk_level }}"

          RISK_SCORE="${{ steps.risk.outputs.risk_score }}"

          DECISION="${{ steps.risk.outputs.decision }}"


          echo "=========================================="

          echo "AI Security Gate"

          echo "=========================================="


          echo ""

          echo "Risk Level : $RISK_LEVEL"

          echo "Risk Score : $RISK_SCORE"

          echo "Decision   : $DECISION"


          # --------------------------------------------------
          # HIGH
          # --------------------------------------------------

          if [ "$RISK_LEVEL" = "HIGH" ]; then

            echo ""

            echo "HIGH RISK DETECTED"

            echo ""

            echo "Terraform deployment blocked."

            echo "Manual security review required."


            exit 1

          fi


          # --------------------------------------------------
          # MEDIUM
          # --------------------------------------------------

          if [ "$RISK_LEVEL" = "MEDIUM" ]; then

            echo ""

            echo "MEDIUM RISK"

            echo "Review recommended."

            echo "Pipeline will continue."

          fi


          # --------------------------------------------------
          # LOW
          # --------------------------------------------------

          if [ "$RISK_LEVEL" = "LOW" ]; then

            echo ""

            echo "LOW RISK"

            echo "Pipeline can continue."

          fi


      # ======================================================
      # Upload AI Review
      # ======================================================

      - name: Upload AI Review

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: terraform-ai-review

          path: |

            ai-review.json

            ai-review-output.txt

            ai-review-error.log

            pr-comment.md

          if-no-files-found: warn


  # ==========================================================
  # Stage 4 - Terraform Apply
  # ==========================================================

  apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - ai-review


    # --------------------------------------------------------
    # Apply ONLY after merge/push to main
    # --------------------------------------------------------

    if: >

      github.event_name == 'push' &&

      github.ref == 'refs/heads/main'


    # --------------------------------------------------------
    # Production Environment Approval
    # --------------------------------------------------------

    environment:

      name: production


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply

        working-directory: parent_module

        run: |

          echo "=========================================="

          echo "Terraform Apply"

          echo "=========================================="


          terraform apply -auto-approve


          echo ""

          echo "Terraform Apply completed successfully."