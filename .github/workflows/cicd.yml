name: Terraform AI Security Review

on:

  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:

  id-token: write
  contents: read
  pull-requests: write


# ============================================================
# Stage 1 - Security Scan
# ============================================================

jobs:

  security-scan:

    name: Terraform Security Scan

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      - name: Terraform Version

        run: |

          terraform version


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check

        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate

        working-directory: parent_module

        run: |

          terraform validate


      # ======================================================
      # Gitleaks
      # ======================================================

      - name: Install Gitleaks

        run: |

          sudo apt-get update

          sudo apt-get install -y gitleaks


      - name: Run Gitleaks

        run: |

          gitleaks detect \
            --source . \
            --exit-code 1


      # ======================================================
      # TruffleHog
      # ======================================================

      - name: Install TruffleHog

        run: |

          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin


      - name: Run TruffleHog

        run: |

          trufflehog filesystem . --json > trufflehog-report.json


      # ======================================================
      # TFLint
      # ======================================================

      - name: Install TFLint

        run: |

          curl -s \
            https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh \
            | bash


      - name: Run TFLint

        working-directory: parent_module

        run: |

          tflint --init

          tflint


      # ======================================================
      # tfsec
      # ======================================================

      - name: Install tfsec

        run: |

          curl -s \
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | bash


      - name: Run tfsec

        working-directory: parent_module

        run: |

          tfsec .


  # ==========================================================
  # Stage 2 - Terraform Plan
  # ==========================================================

  plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - security-scan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Azure Account Diagnostics
      # ------------------------------------------------------

      - name: Azure Account Diagnostics

        run: |

          echo "=========================================="
          echo "Azure Account Diagnostics"
          echo "=========================================="

          az account show \
            --query "{subscriptionId:id,subscriptionName:name,tenantId:tenantId,user:user.name}" \
            --output table

          echo ""

          echo "Azure CLI version:"

          az version --output table


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan

        working-directory: parent_module

        run: |

          terraform plan -out=tfplan


      # ------------------------------------------------------
      # Terraform Plan JSON
      # ------------------------------------------------------

      - name: Terraform Show JSON

        working-directory: parent_module

        run: |

          terraform show -json tfplan > tfplan.json


      # ------------------------------------------------------
      # Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="
          echo "Terraform Plan Verification"
          echo "=========================================="

          ls -lh parent_module/tfplan

          ls -lh parent_module/tfplan.json

          test -f parent_module/tfplan

          test -f parent_module/tfplan.json

          echo ""

          echo "Terraform plan generated successfully"


      # ------------------------------------------------------
      # Upload Terraform Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan

          path: |

            parent_module/tfplan

            parent_module/tfplan.json


  # ==========================================================
  # Stage 3 - AI Terraform Security Review
  # ==========================================================

  ai-review:

    name: AI Terraform Security Review

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - plan

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ------------------------------------------------------
      # Python Dependencies
      # ------------------------------------------------------

      - name: Install Python Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r agent/requirements.txt


      # ------------------------------------------------------
      # Download Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan

          path: parent_module


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="
          echo "Terraform Plan Verification"
          echo "=========================================="

          ls -lh parent_module/

          test -f parent_module/tfplan

          test -f parent_module/tfplan.json

          echo ""

          echo "tfplan found successfully"

          echo "tfplan.json found successfully"


      # ------------------------------------------------------
      # Verify AI Agent
      # ------------------------------------------------------

      - name: Verify AI Agent

        run: |

          echo "=========================================="
          echo "AI Agent Verification"
          echo "=========================================="

          ls -lh agent/

          test -f agent/agent.py

          echo ""

          echo "agent.py found"

          python --version


      # ------------------------------------------------------
      # Verify Python Packages
      # ------------------------------------------------------

      - name: Verify Python Packages

        run: |

          echo "=========================================="
          echo "Python Package Verification"
          echo "=========================================="

          python -c "

          import openai
          import azure.core
          import azure.search.documents
          import azure.search.documents.indexes

          print('openai import OK')
          print('azure.core import OK')
          print('azure.search.documents import OK')
          print('azure.search.documents.indexes import OK')

          "


      # ======================================================
      # Azure Configuration
      # ======================================================

      - name: Verify Azure Configuration

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "Azure Configuration Validation"
          echo "=========================================="

          test -n "$AZURE_SEARCH_ENDPOINT" || {
            echo "ERROR: AZURE_SEARCH_ENDPOINT is missing"
            exit 1
          }

          test -n "$AZURE_SEARCH_API_KEY" || {
            echo "ERROR: AZURE_SEARCH_API_KEY is missing"
            exit 1
          }

          test -n "$AZURE_SEARCH_INDEX" || {
            echo "ERROR: AZURE_SEARCH_INDEX is missing"
            exit 1
          }

          test -n "$AZURE_OPENAI_ENDPOINT" || {
            echo "ERROR: AZURE_OPENAI_ENDPOINT is missing"
            exit 1
          }

          test -n "$AZURE_OPENAI_API_KEY" || {
            echo "ERROR: AZURE_OPENAI_API_KEY is missing"
            exit 1
          }

          test -n "$AZURE_OPENAI_DEPLOYMENT" || {
            echo "ERROR: AZURE_OPENAI_DEPLOYMENT is missing"
            exit 1
          }

          echo ""

          echo "All required Azure secrets are present."

          echo ""

          echo "Search Endpoint:"
          echo "$AZURE_SEARCH_ENDPOINT"

          echo ""

          echo "Search Index:"
          echo "$AZURE_SEARCH_INDEX"

          echo ""

          echo "OpenAI Endpoint:"
          echo "$AZURE_OPENAI_ENDPOINT"

          echo ""

          echo "OpenAI Deployment:"
          echo "$AZURE_OPENAI_DEPLOYMENT"


      # ======================================================
      # DIAGNOSTIC 1
      # Azure Subscription
      # ======================================================

      - name: Diagnostic - Azure Subscription

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 1 - Azure Subscription"
          echo "=========================================="

          az account show \
            --query "{subscriptionId:id,subscriptionName:name,tenantId:tenantId,user:user.name}" \
            --output table

          echo ""

          echo "Subscription ID:"

          az account show \
            --query id \
            --output tsv

          echo ""

          echo "Tenant ID:"

          az account show \
            --query tenantId \
            --output tsv


      # ======================================================
      # DIAGNOSTIC 2
      # Parse Search Endpoint
      # ======================================================

      - name: Diagnostic - Parse Search Endpoint

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 2 - Azure Search Endpoint"
          echo "=========================================="

          python - <<'PY'

          import os

          from urllib.parse import urlparse


          endpoint = os.environ[
              "AZURE_SEARCH_ENDPOINT"
          ].strip()


          parsed = urlparse(endpoint)


          print("Configured endpoint:")
          print(endpoint)

          print("")

          print("Scheme :", parsed.scheme)
          print("Host   :", parsed.hostname)
          print("Path   :", parsed.path)


          if parsed.scheme != "https":

              print("")
              print("ERROR: Search endpoint must use HTTPS.")

              raise SystemExit(1)


          if not parsed.hostname:

              print("")
              print("ERROR: Search endpoint hostname missing.")

              raise SystemExit(1)


          host = parsed.hostname


          if not host.endswith(
              ".search.windows.net"
          ):

              print("")
              print(
                  "WARNING: Host does not look like a standard "
                  "Azure AI Search endpoint."
              )

              print("")
              print(
                  "Expected:"
              )

              print(
                  "https://<service-name>.search.windows.net"
              )


          service_name = host.split(".")[0]


          print("")
          print(
              "Detected Search Service Name:"
          )

          print(service_name)


          with open(
              "/tmp/search_service_name",
              "w"
          ) as f:

              f.write(service_name)


      # ======================================================
      # DIAGNOSTIC 3
      # DNS
      # ======================================================

      - name: Diagnostic - Search DNS

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 3 - Azure Search DNS"
          echo "=========================================="

          SEARCH_HOST=$(python - <<'PY'
          import os
          from urllib.parse import urlparse

          print(
              urlparse(
                  os.environ["AZURE_SEARCH_ENDPOINT"]
              ).hostname
          )
          PY
          )

          echo "Search Host:"
          echo "$SEARCH_HOST"

          echo ""

          echo "DNS lookup:"

          getent hosts "$SEARCH_HOST" || true

          echo ""

          echo "DNS diagnostic completed."


      # ======================================================
      # DIAGNOSTIC 4
      # Azure Search Services
      #
      # IMPORTANT ROOT CAUSE CHECK
      # ======================================================

      - name: Diagnostic - Azure Search Services

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 4 - Azure Search Services"
          echo "=========================================="

          echo ""

          echo "Search services visible in authenticated subscription:"

          echo ""

          az resource list \
            --resource-type Microsoft.Search/searchServices \
            --query "[].{name:name,resourceGroup:resourceGroup,location:location,id:id}" \
            --output table

          echo ""

          SEARCH_SERVICE=$(python - <<'PY'
          import os
          from urllib.parse import urlparse

          host = urlparse(
              os.environ["AZURE_SEARCH_ENDPOINT"]
          ).hostname

          print(
              host.split(".")[0]
          )
          PY
          )

          echo "Search service extracted from GitHub secret:"
          echo "$SEARCH_SERVICE"

          echo ""

          FOUND=$(az resource list \
            --resource-type Microsoft.Search/searchServices \
            --query "[?name=='$SEARCH_SERVICE'].id | [0]" \
            --output tsv)

          if [ -z "$FOUND" ]; then

            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ROOT CAUSE CANDIDATE"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

            echo ""

            echo "Search service was NOT found in the"
            echo "authenticated Azure subscription."

            echo ""

            echo "Expected Search Service:"
            echo "$SEARCH_SERVICE"

            echo ""

            echo "Possible causes:"

            echo "1. Wrong AZURE_SEARCH_ENDPOINT"

            echo "2. Wrong AZURE_SUBSCRIPTION_ID"

            echo "3. Search service exists in another subscription"

            echo "4. Search service was deleted"

            echo "5. GitHub OIDC is authenticating against wrong tenant/subscription"

            echo ""

            exit 1

          fi


          echo "SUCCESS: Search service exists."

          echo ""

          echo "Resource ID:"
          echo "$FOUND"


          echo "$FOUND" > /tmp/search_resource_id


      # ======================================================
      # DIAGNOSTIC 5
      # Actual Azure Search Endpoint
      # ======================================================

      - name: Diagnostic - Actual Azure Search Endpoint

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 5 - Actual Azure Search Endpoint"
          echo "=========================================="

          SEARCH_RESOURCE_ID=$(cat /tmp/search_resource_id)


          echo "Search Resource:"
          echo "$SEARCH_RESOURCE_ID"

          echo ""


          ACTUAL_ENDPOINT=$(az resource show \
            --ids "$SEARCH_RESOURCE_ID" \
            --query "properties.endpoint" \
            --output tsv)


          echo "Actual Azure Search endpoint:"
          echo "$ACTUAL_ENDPOINT"

          echo ""


          SECRET_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}"


          echo "GitHub secret endpoint:"
          echo "$SECRET_ENDPOINT"

          echo ""


          if [ "$ACTUAL_ENDPOINT" = "$SECRET_ENDPOINT" ]; then

            echo "SUCCESS:"
            echo "GitHub endpoint matches Azure."

          else

            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ROOT CAUSE FOUND"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

            echo ""

            echo "GitHub AZURE_SEARCH_ENDPOINT does NOT"
            echo "match the endpoint configured on Azure."

            echo ""

            echo "GitHub:"
            echo "$SECRET_ENDPOINT"

            echo ""

            echo "Azure:"
            echo "$ACTUAL_ENDPOINT"

            echo ""

            echo "Update GitHub Secret:"
            echo "AZURE_SEARCH_ENDPOINT"

            echo ""

            exit 1

          fi


      # ======================================================
      # DIAGNOSTIC 6
      # Search Service Properties
      # ======================================================

      - name: Diagnostic - Search Service Properties

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 6 - Search Service Properties"
          echo "=========================================="

          SEARCH_RESOURCE_ID=$(cat /tmp/search_resource_id)


          az resource show \
            --ids "$SEARCH_RESOURCE_ID" \
            --query "{name:name,resourceGroup:resourceGroup,location:location,sku:sku.name,endpoint:properties.endpoint,provisioningState:properties.provisioningState,publicNetworkAccess:properties.publicNetworkAccess}" \
            --output json


      # ======================================================
      # DIAGNOSTIC 7
      # Direct REST API
      #
      # This bypasses Python SDK.
      # ======================================================

      - name: Diagnostic - Search REST API

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 7 - Azure Search REST API"
          echo "=========================================="

          RESPONSE_FILE="/tmp/search-indexes.json"


          set +e


          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --connect-timeout 10 \
            --request GET \
            --header "api-key: $AZURE_SEARCH_API_KEY" \
            --header "Content-Type: application/json" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "$AZURE_SEARCH_ENDPOINT/indexes?api-version=2025-09-01")


          CURL_EXIT=$?


          set -e


          echo ""

          echo "curl exit code:"
          echo "$CURL_EXIT"

          echo ""

          echo "HTTP status:"
          echo "$HTTP_CODE"

          echo ""

          echo "Response body:"

          cat "$RESPONSE_FILE" || true

          echo ""


          if [ "$HTTP_CODE" = "200" ]; then

            echo "SUCCESS:"
            echo "Azure Search REST API is working."

          elif [ "$HTTP_CODE" = "403" ]; then

            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ROOT CAUSE CANDIDATE"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

            echo ""

            echo "Azure Search returned HTTP 403."

            echo ""

            echo "Likely API key problem."

            echo "Make sure AZURE_SEARCH_API_KEY is an"
            echo "ADMIN key, not a QUERY key."

            echo ""

            exit 1

          elif [ "$HTTP_CODE" = "404" ]; then

            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ROOT CAUSE CONFIRMED"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

            echo ""

            echo "Azure Search REST API itself returned 404."

            echo ""

            echo "Therefore the problem is NOT:"
            echo "- Python SDK"
            echo "- SearchClient"
            echo "- SearchIndexClient"
            echo "- agent.py"

            echo ""

            echo "The problem is at Azure Search resource/"
            echo "endpoint level."

            echo ""

            echo "Check:"
            echo "1. Search service endpoint"
            echo "2. Azure subscription"
            echo "3. Azure tenant"
            echo "4. Search service existence"
            echo "5. Public network access"
            echo "6. Azure cloud/environment"

            echo ""

            exit 1

          else

            echo "Unexpected HTTP status:"
            echo "$HTTP_CODE"

            exit 1

          fi


      # ======================================================
      # DIAGNOSTIC 8
      # Parse Search Indexes
      # ======================================================

      - name: Diagnostic - Search Index Names

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 8 - Azure Search Index Names"
          echo "=========================================="

          python - <<'PY'

          import json

          from pathlib import Path


          path = Path(
              "/tmp/search-indexes.json"
          )


          if not path.exists():

              print(
                  "ERROR: Search index response missing."
              )

              raise SystemExit(1)


          data = json.loads(
              path.read_text()
          )


          indexes = data.get(
              "value",
              []
          )


          print(
              "Number of indexes:",
              len(indexes)
          )


          print("")


          names = []


          for index in indexes:

              name = index.get(
                  "name"
              )

              names.append(name)

              print(
                  "INDEX:",
                  name
              )


          expected = "${{ secrets.AZURE_SEARCH_INDEX }}"


          print("")

          print(
              "Configured index:",
              expected
          )


          print("")


          if expected in names:

              print(
                  "SUCCESS: Configured index exists."
              )

          else:

              print(
                  "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              )

              print(
                  "ROOT CAUSE FOUND"
              )

              print(
                  "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              )

              print("")

              print(
                  "Configured index does NOT exist."
              )

              print("")

              print(
                  "Configured:",
                  expected
              )

              print("")

              print(
                  "Available:",
                  names
              )

              raise SystemExit(1)

          PY


      # ======================================================
      # DIAGNOSTIC 9
      # Python Search SDK
      # ======================================================

      - name: Diagnostic - Search SDK

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 9 - Python Search SDK"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.search.documents.indexes import SearchIndexClient


          endpoint = os.environ[
              "AZURE_SEARCH_ENDPOINT"
          ]


          api_key = os.environ[
              "AZURE_SEARCH_API_KEY"
          ]


          client = SearchIndexClient(

              endpoint=endpoint,

              credential=AzureKeyCredential(
                  api_key
              )

          )


          print(
              "Calling SearchIndexClient.list_indexes()..."
          )


          indexes = list(
              client.list_indexes()
          )


          print("")

          print(
              "SUCCESS: SDK list_indexes() worked."
          )


          print("")


          for index in indexes:

              print(
                  "INDEX:",
                  index.name
              )

          PY


      # ======================================================
      # DIAGNOSTIC 10
      # Specific Index
      # ======================================================

      - name: Diagnostic - Specific Search Index

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 10 - Specific Search Index"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.core.exceptions import ResourceNotFoundError

          from azure.search.documents.indexes import SearchIndexClient


          client = SearchIndexClient(

              endpoint=os.environ[
                  "AZURE_SEARCH_ENDPOINT"
              ],

              credential=AzureKeyCredential(
                  os.environ[
                      "AZURE_SEARCH_API_KEY"
                  ]
              )

          )


          index_name = os.environ[
              "AZURE_SEARCH_INDEX"
          ]


          print(
              "Checking index:",
              index_name
          )


          try:

              index = client.get_index(
                  index_name
              )


              print("")

              print(
                  "SUCCESS: Index exists."
              )


              print("")

              print(
                  "Index:",
                  index.name
              )


              print("")

              print("Fields:")


              for field in index.fields:

                  print(
                      "-",
                      field.name,
                      "|",
                      field.type
                  )


          except ResourceNotFoundError as error:

              print("")

              print(
                  "ROOT CAUSE:"
              )

              print(
                  "Configured index does not exist."
              )

              print("")

              print(error)

              raise

          PY


      # ======================================================
      # DIAGNOSTIC 11
      # Document Count
      # ======================================================

      - name: Diagnostic - Search Document Count

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 11 - Search Documents"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.search.documents import SearchClient


          client = SearchClient(

              endpoint=os.environ[
                  "AZURE_SEARCH_ENDPOINT"
              ],

              index_name=os.environ[
                  "AZURE_SEARCH_INDEX"
              ],

              credential=AzureKeyCredential(
                  os.environ[
                      "AZURE_SEARCH_API_KEY"
                  ]
              )

          )


          count = client.get_document_count()


          print("")

          print(
              "Azure Search document count:",
              count
          )


          print("")


          if count == 0:

              print(
                  "WARNING:"
              )

              print(
                  "Index exists but contains ZERO documents."
              )

              print(
                  "RAG retrieval will return no policies."
              )

          else:

              print(
                  "SUCCESS:"
              )

              print(
                  "Index contains documents."
              )

              print(
                  "RAG corpus is populated."
              )

      # ======================================================
      # DIAGNOSTIC 12
      # Search Query
      # ======================================================

      - name: Diagnostic - Search Query

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 12 - Azure Search Query"
          echo "=========================================="

          python - <<'PY'

          import os

          from azure.core.credentials import AzureKeyCredential

          from azure.search.documents import SearchClient


          client = SearchClient(

              endpoint=os.environ[
                  "AZURE_SEARCH_ENDPOINT"
              ],

              index_name=os.environ[
                  "AZURE_SEARCH_INDEX"
              ],

              credential=AzureKeyCredential(
                  os.environ[
                      "AZURE_SEARCH_API_KEY"
                  ]
              )

          )


          print(
              "Searching for: terraform"
          )


          results = client.search(

              search_text="terraform",

              top=5

          )


          count = 0


          for result in results:

              count += 1

              print("")

              print(
                  "DOCUMENT",
                  count
              )

              print(
                  result
              )


          print("")

          print(
              "Documents returned:",
              count
          )


          if count == 0:

              print("")

              print(
                  "WARNING:"
              )

              print(
                  "Search works but no documents matched."
              )

          else:

              print("")

              print(
                  "SUCCESS:"
              )

              print(
                  "Search query returned documents."
              )

          PY


      # ======================================================
      # DIAGNOSTIC 13
      # Azure OpenAI Endpoint
      # ======================================================

      - name: Diagnostic - Azure OpenAI Endpoint

        env:

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 13 - Azure OpenAI Endpoint"
          echo "=========================================="

          python - <<'PY'

          import os

          from urllib.parse import urlparse


          endpoint = os.environ[
              "AZURE_OPENAI_ENDPOINT"
          ]


          deployment = os.environ[
              "AZURE_OPENAI_DEPLOYMENT"
          ]


          parsed = urlparse(
              endpoint
          )


          print(
              "Endpoint:",
              endpoint
          )


          print("")

          print(
              "Scheme:",
              parsed.scheme
          )


          print(
              "Host:",
              parsed.hostname
          )


          print(
              "Path:",
              parsed.path
          )


          print("")

          print(
              "Deployment:",
              deployment
          )


          if parsed.scheme != "https":

              print(
                  "ERROR: Azure OpenAI endpoint must use HTTPS."
              )

              raise SystemExit(1)


          if not parsed.hostname:

              print(
                  "ERROR: Azure OpenAI hostname missing."
              )

              raise SystemExit(1)


          if "/openai/" in parsed.path:

              print("")

              print(
                  "ERROR: Endpoint contains /openai/ path."
              )

              print("")

              print(
                  "Use:"
              )

              print(
                  "https://<resource>.openai.azure.com/"
              )

              raise SystemExit(1)


          print("")

          print(
              "Azure OpenAI endpoint format looks valid."
          )


      # ======================================================
      # DIAGNOSTIC 14
      # Azure OpenAI API
      # ======================================================

      - name: Diagnostic - Azure OpenAI API

        timeout-minutes: 5

        env:

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 14 - Azure OpenAI API"
          echo "=========================================="

          python - <<'PY'

          import os

          from openai import AzureOpenAI

          from openai import APIStatusError

          from openai import APIConnectionError


          endpoint = os.environ[
              "AZURE_OPENAI_ENDPOINT"
          ]


          api_key = os.environ[
              "AZURE_OPENAI_API_KEY"
          ]


          deployment = os.environ[
              "AZURE_OPENAI_DEPLOYMENT"
          ]


          client = AzureOpenAI(

              azure_endpoint=endpoint,

              api_key=api_key,

              api_version="2024-10-21"

          )


          print(
              "Calling deployment:",
              deployment
          )


          try:

              response = client.chat.completions.create(

                  model=deployment,

                  messages=[

                      {

                          "role": "user",

                          "content": "Reply with exactly OK"

                      }

                  ],

                  max_tokens=5,

                  temperature=0,

                  timeout=30

              )


              print("")

              print(
                  "Azure OpenAI response:"
              )

              print(
                  response.choices[0].message.content
              )


              print("")

              print(
                  "SUCCESS: Azure OpenAI API working."
              )


          except APIStatusError as error:

              print("")

              print(
                  "AZURE OPENAI API ERROR"
              )

              print("")

              print(
                  "Status:",
                  error.status_code
              )

              print("")

              print(
                  "Error:",
                  error
              )

              print("")

              print(
