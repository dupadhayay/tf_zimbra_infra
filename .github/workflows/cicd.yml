              )

              print(
                  "1. Wrong deployment name"
              )

              print(
                  "2. Wrong endpoint"
              )

              print(
                  "3. Invalid API key"
              )

              print(
                  "4. Wrong API version"
              )

              print(
                  "5. Deployment does not exist"
              )

              raise


          except APIConnectionError as error:

              print("")

              print(
                  "AZURE OPENAI CONNECTION ERROR"
              )

              print("")

              print(error)

              raise


      # ======================================================
      # DIAGNOSTIC 15
      # Python Environment
      # ======================================================

      - name: Diagnostic - Python Environment

        run: |

          echo "=========================================="
          echo "DIAGNOSTIC 15 - Python Environment"
          echo "=========================================="

          python --version

          echo ""

          python -m pip --version

          echo ""

          echo "Installed Azure/OpenAI packages:"

          python -m pip list | grep -Ei \
            "azure|openai" || true

          echo ""

          echo "Python executable:"

          which python


      # ======================================================
      # Run Terraform AI Reviewer
      # ======================================================

      - name: Run Terraform AI Reviewer

        timeout-minutes: 15

        env:

          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}

          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}

          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}

          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

        run: |

          echo "=========================================="
          echo "Running Terraform AI Reviewer"
          echo "=========================================="

          echo ""

          echo "Terraform Plan:"
          ls -lh parent_module/tfplan.json

          echo ""

          echo "Executing agent.py..."

          echo ""

          echo "AI Reviewer hard timeout: 15 minutes"


          set +e


          timeout \
            --signal=TERM \
            --kill-after=30s \
            15m \
            python -u agent/agent.py parent_module/tfplan.json \
            > ai-review-output.txt \
            2> ai-review-error.log


          EXIT_CODE=$?


          set -e


          echo ""

          echo "Agent Exit Code:"
          echo "$EXIT_CODE"


          echo ""

          echo "=========================================="
          echo "Agent STDOUT"
          echo "=========================================="


          cat ai-review-output.txt || true


          echo ""

          echo "=========================================="
          echo "Agent STDERR"
          echo "=========================================="


          cat ai-review-error.log || true


          if [ "$EXIT_CODE" -eq 124 ]; then

            echo ""

            echo "AI Reviewer exceeded 15 minutes."

            exit 124

          fi


          if [ "$EXIT_CODE" -eq 143 ] || [ "$EXIT_CODE" -eq 137 ]; then

            echo ""

            echo "AI Reviewer process terminated."

            echo "Exit Code:"
            echo "$EXIT_CODE"

            exit "$EXIT_CODE"

          fi


          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""

            echo "=========================================="
            echo "AI REVIEWER FAILED"
            echo "=========================================="

            echo ""

            echo "Exit Code:"
            echo "$EXIT_CODE"

            echo ""

            echo "STDERR:"
            cat ai-review-error.log || true

            echo ""

            echo "STDOUT:"
            cat ai-review-output.txt || true

            exit "$EXIT_CODE"

          fi


          echo ""

          echo "=========================================="
          echo "AI REVIEWER COMPLETED"
          echo "=========================================="


      # ======================================================
      # Prepare AI Review JSON
      # ======================================================

      - name: Prepare AI Review JSON

        run: |

          python - <<'PY'

          import json

          from pathlib import Path


          output_file = Path(
              "ai-review-output.txt"
          )


          if not output_file.exists():

              print(
                  "AI output file not found."
              )

              raise SystemExit(1)


          output = output_file.read_text(
              errors="replace"
          ).strip()


          print(
              "AI output length:",
              len(output)
          )


          if not output:

              print(
                  "AI reviewer returned empty output."
              )

              raise SystemExit(1)


          try:

              data = json.loads(
                  output
              )


          except json.JSONDecodeError:

              print(
                  "Direct JSON parsing failed."
              )

              print(
                  "Trying to extract JSON object..."
              )


              start = output.find("{")

              end = output.rfind("}")


              if (

                  start == -1

                  or end == -1

                  or end <= start

              ):

                  print(
                      "Could not find JSON object."
                  )

                  print(output)

                  raise SystemExit(1)


              json_text = output[
                  start:end + 1
              ]


              try:

                  data = json.loads(
                      json_text
                  )

              except json.JSONDecodeError as error:

                  print(
                      "Extracted JSON is invalid."
                  )

                  print(error)

                  print(json_text)

                  raise SystemExit(1)


          Path(
              "ai-review.json"
          ).write_text(

              json.dumps(
                  data,
                  indent=2
              )

          )


          print("")

          print(
              "ai-review.json created successfully."
          )

          print("")

          print(
              json.dumps(
                  data,
                  indent=2
              )
          )

          PY


      # ======================================================
      # Validate AI Review JSON
      # ======================================================

      - name: Validate AI Review JSON

        run: |

          python - <<'PY'

          import json


          with open(
              "ai-review.json"
          ) as f:

              data = json.load(f)


          print("==========================================")
          print("AI Review JSON Validation")
          print("==========================================")


          print(
              "Valid JSON"
          )


          print("")


          print(
              "Risk Level:",
              data.get(
                  "risk_level",
                  "UNKNOWN"
              )
          )


          print(
              "Risk Score:",
              data.get(
                  "risk_score",
                  0
              )
          )


          print(
              "Decision:",
              data.get(
                  "decision",
                  "UNKNOWN"
              )
          )


          print("")

          print(
              "Security Signals:"
          )


          signals = data.get(
              "security_signals",
              []
          )


          if signals:

              for signal in signals:

                  print(
                      "-",
                      signal
                  )

          else:

              print(
                  "No security signals detected."
              )

          PY


      # ======================================================
      # Display Final AI Review
      # ======================================================

      - name: Display AI Review

        run: |

          echo "=========================================="
          echo "Final AI Review"
          echo "=========================================="

          cat ai-review.json


      # ======================================================
      # Extract Risk Information
      # ======================================================

      - name: Extract Risk Information

        id: risk

        run: |

          RISK_LEVEL=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'risk_level',
                  'UNKNOWN'
              )
          )

          ")


          RISK_SCORE=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'risk_score',
                  0
              )
          )

          ")


          DECISION=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'decision',
                  'UNKNOWN'
              )
          )

          ")


          echo ""

          echo "Risk Level: $RISK_LEVEL"

          echo "Risk Score: $RISK_SCORE"

          echo "Decision: $DECISION"

          echo ""


          echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

          echo "risk_score=$RISK_SCORE" >> "$GITHUB_OUTPUT"

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # Create PR Comment
      # ======================================================

      - name: Create AI Review Report

        run: |

          python - <<'PY'

          import json


          with open(
              "ai-review.json"
          ) as f:

              data = json.load(f)


          risk_level = data.get(
              "risk_level",
              "UNKNOWN"
          )


          risk_score = data.get(
              "risk_score",
              0
          )


          destroy_count = data.get(
              "destroy_count",
              0
          )


          create_count = data.get(
              "create_count",
              0
          )


          update_count = data.get(
              "update_count",
              0
          )


          signals = data.get(
              "security_signals",
              []
          )


          llm_review = data.get(
              "llm_review",
              {}
          )


          summary = llm_review.get(
              "summary",
              "No LLM summary available."
          )


          recommendations = llm_review.get(
              "recommendations",
              []
          )


          with open(
              "pr-comment.md",
              "w"
          ) as f:

              f.write(
                  "# 🤖 Terraform AI Security Review\n\n"
              )


              f.write(
                  f"## Risk: **{risk_level}** "
                  f"({risk_score}/100)\n\n"
              )


              f.write(
                  "### Terraform Changes\n\n"
              )


              f.write(
                  f"- Create: **{create_count}**\n"
              )


              f.write(
                  f"- Update: **{update_count}**\n"
              )


              f.write(
                  f"- Destroy: **{destroy_count}**\n\n"
              )


              f.write(
                  "### Security Signals\n\n"
              )


              if signals:

                  for signal in signals:

                      f.write(

                          f"- **{signal.get('type', 'UNKNOWN')}** — "
                          f"{signal.get('severity', 'UNKNOWN')} — "
                          f"{signal.get('reason', 'No reason provided')}  \n"

                      )

              else:

                  f.write(
                      "No security signals detected.  \n"
                  )


              f.write(
                  "\n### AI Assessment\n\n"
              )


              f.write(
                  str(summary)
              )


              f.write(
                  "\n\n### Recommendations\n\n"
              )


              if recommendations:

                  for recommendation in recommendations:

                      f.write(
                          f"- {recommendation}\n"
                      )

              else:

                  f.write(
                      "- No additional recommendations.\n"
                  )


              f.write(
                  "\n---\n"
                  "Generated by Terraform AI Security Reviewer."
              )

          PY


      # ======================================================
      # Comment on Pull Request
      # ======================================================

      - name: Comment on Pull Request

        if: github.event_name == 'pull_request'

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          gh pr comment \
            "${{ github.event.pull_request.number }}" \
            --body-file pr-comment.md


      # ======================================================
      # AI Security Gate
      # ======================================================

      - name: Enforce AI Security Gate

        run: |

          RISK_LEVEL="${{ steps.risk.outputs.risk_level }}"

          RISK_SCORE="${{ steps.risk.outputs.risk_score }}"

          DECISION="${{ steps.risk.outputs.decision }}"


          echo "=========================================="
          echo "AI Security Gate"
          echo "=========================================="


          echo ""

          echo "Risk Level : $RISK_LEVEL"

          echo "Risk Score : $RISK_SCORE"

          echo "Decision   : $DECISION"


          if [ "$RISK_LEVEL" = "HIGH" ]; then

            echo ""

            echo "HIGH RISK DETECTED"

            echo ""

            echo "Terraform deployment blocked."

            echo "Manual security review required."

            exit 1

          fi


          if [ "$RISK_LEVEL" = "MEDIUM" ]; then

            echo ""

            echo "MEDIUM RISK"

            echo "Review recommended."

            echo "Pipeline will continue."

          fi


          if [ "$RISK_LEVEL" = "LOW" ]; then

            echo ""

            echo "LOW RISK"

            echo "Pipeline can continue."

          fi


      # ======================================================
      # Upload AI Review
      # ======================================================

      - name: Upload AI Review

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: terraform-ai-review

          path: |

            ai-review.json

            ai-review-output.txt

            ai-review-error.log

            pr-comment.md

          if-no-files-found: warn


  # ==========================================================
  # Stage 4 - Terraform Apply
  # ==========================================================

  apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - ai-review


    # --------------------------------------------------------
    # Apply ONLY after merge/push to main
    # --------------------------------------------------------

    if: >

      github.event_name == 'push' &&

      github.ref == 'refs/heads/main'


    # --------------------------------------------------------
    # Production Environment Approval
    # --------------------------------------------------------

    environment:

      name: production


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Azure Account Diagnostics
      # ------------------------------------------------------

      - name: Azure Account Diagnostics

        run: |

          echo "=========================================="
          echo "Azure Account Diagnostics"
          echo "=========================================="

          az account show \
            --query "{subscriptionId:id,subscriptionName:name,tenantId:tenantId,user:user.name}" \
            --output table


      # ------------------------------------------------------
      # Download Reviewed Terraform Plan
      # ------------------------------------------------------

      - name: Download Reviewed Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan

          path: parent_module


      # ------------------------------------------------------
      # Verify Reviewed Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="
          echo "Reviewed Terraform Plan"
          echo "=========================================="

          ls -lh parent_module/


          test -f parent_module/tfplan


          echo ""

          echo "Reviewed tfplan found successfully."


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Apply
      #
      # IMPORTANT:
      #
      # Apply EXACT plan reviewed by AI.
      #
      # Do NOT create a new plan here.
      # ------------------------------------------------------

      - name: Terraform Apply

        working-directory: parent_module

        run: |

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          echo ""

          echo "Applying AI-reviewed Terraform plan..."

          terraform apply \
            -auto-approve \
            tfplan

          echo ""

          echo "Terraform Apply completed successfully."