              )
          )


          print(
              "Risk Score:",
              data.get(
                  "risk_score",
                  0
              )
          )


          print(
              "Decision:",
              data.get(
                  "decision",
                  "UNKNOWN"
              )
          )


          print("")

          print(
              "Security Signals:"
          )


          signals = data.get(
              "security_signals",
              []
          )


          if signals:

              for signal in signals:

                  print(
                      "-",
                      signal
                  )

          else:

              print(
                  "No security signals detected."
              )

          PY


      # ======================================================
      # Display Final AI Review
      # ======================================================

      - name: Display AI Review

        run: |

          echo "=========================================="

          echo "Final AI Review"

          echo "=========================================="


          cat ai-review.json


      # ======================================================
      # Extract Risk Information
      # ======================================================

      - name: Extract Risk Information

        id: risk

        run: |

          RISK_LEVEL=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'risk_level',
                  'UNKNOWN'
              )
          )

          ")


          RISK_SCORE=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'risk_score',
                  0
              )
          )

          ")


          DECISION=$(python -c "

          import json

          with open('ai-review.json') as f:

              data = json.load(f)

          print(
              data.get(
                  'decision',
                  'UNKNOWN'
              )
          )

          ")


          echo ""

          echo "Risk Level: $RISK_LEVEL"

          echo "Risk Score: $RISK_SCORE"

          echo "Decision: $DECISION"

          echo ""

          echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"

          echo "risk_score=$RISK_SCORE" >> "$GITHUB_OUTPUT"

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"


      # ======================================================
      # Create PR Comment
      # ======================================================

      - name: Create AI Review Report

        run: |

          python - <<'PY'

          import json


          with open(
              "ai-review.json"
          ) as f:

              data = json.load(f)


          risk_level = data.get(
              "risk_level",
              "UNKNOWN"
          )


          risk_score = data.get(
              "risk_score",
              0
          )


          destroy_count = data.get(
              "destroy_count",
              0
          )


          create_count = data.get(
              "create_count",
              0
          )


          update_count = data.get(
              "update_count",
              0
          )


          signals = data.get(
              "security_signals",
              []
          )


          llm_review = data.get(
              "llm_review",
              {}
          )


          summary = llm_review.get(
              "summary",
              "No LLM summary available."
          )


          recommendations = llm_review.get(
              "recommendations",
              []
          )


          with open(
              "pr-comment.md",
              "w"
          ) as f:

              f.write(
                  "# 🤖 Terraform AI Security Review\n\n"
              )


              f.write(
                  f"## Risk: **{risk_level}** "
                  f"({risk_score}/100)\n\n"
              )


              f.write(
                  "### Terraform Changes\n\n"
              )


              f.write(
                  f"- Create: **{create_count}**\n"
              )


              f.write(
                  f"- Update: **{update_count}**\n"
              )


              f.write(
                  f"- Destroy: **{destroy_count}**\n\n"
              )


              f.write(
                  "### Security Signals\n\n"
              )


              if signals:

                  for signal in signals:

                      f.write(

                          f"- **{signal.get('type', 'UNKNOWN')}** — "

                          f"{signal.get('severity', 'UNKNOWN')} — "

                          f"{signal.get('reason', 'No reason provided')}  \n"

                      )

              else:

                  f.write(
                      "No security signals detected.  \n"
                  )


              f.write(
                  "\n### AI Assessment\n\n"
              )


              f.write(
                  str(summary)
              )


              f.write(
                  "\n\n### Recommendations\n\n"
              )


              if recommendations:

                  for recommendation in recommendations:

                      f.write(
                          f"- {recommendation}\n"
                      )

              else:

                  f.write(
                      "- No additional recommendations.\n"
                  )


              f.write(
                  "\n---\n"
                  "Generated by Terraform Security Reviewer."
              )

          PY


      # ======================================================
      # Comment on Pull Request
      # ======================================================

      - name: Comment on Pull Request

        if: github.event_name == 'pull_request'

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          gh pr comment \
            "${{ github.event.pull_request.number }}" \
            --body-file pr-comment.md


      # ======================================================
      # AI Security Gate
      # ======================================================

      - name: Enforce AI Security Gate

        run: |

          RISK_LEVEL="${{ steps.risk.outputs.risk_level }}"

          RISK_SCORE="${{ steps.risk.outputs.risk_score }}"

          DECISION="${{ steps.risk.outputs.decision }}"


          echo "=========================================="

          echo "AI Security Gate"

          echo "=========================================="


          echo ""

          echo "Risk Level : $RISK_LEVEL"

          echo "Risk Score : $RISK_SCORE"

          echo "Decision   : $DECISION"


          # --------------------------------------------------
          # HIGH
          # --------------------------------------------------

          if [ "$RISK_LEVEL" = "HIGH" ]; then

            echo ""

            echo "HIGH RISK DETECTED"

            echo ""

            echo "Terraform deployment blocked."

            echo "Manual security review required."

            exit 1

          fi


          # --------------------------------------------------
          # MEDIUM
          # --------------------------------------------------

          if [ "$RISK_LEVEL" = "MEDIUM" ]; then

            echo ""

            echo "MEDIUM RISK"

            echo "Review recommended."

            echo "Pipeline will continue."

          fi


          # --------------------------------------------------
          # LOW
          # --------------------------------------------------

          if [ "$RISK_LEVEL" = "LOW" ]; then

            echo ""

            echo "LOW RISK"

            echo "Pipeline can continue."

          fi


      # ======================================================
      # Upload AI Review
      # ======================================================

      - name: Upload AI Review

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: terraform-ai-review

          path: |

            ai-review.json

            ai-review-output.txt

            ai-review-error.log

            pr-comment.md

          if-no-files-found: warn


  # ==========================================================
  # Stage 4 - Terraform Apply
  # ==========================================================

  apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:

      - ai-review


    # --------------------------------------------------------
    # Apply ONLY after merge/push to main
    # --------------------------------------------------------

    if: >

      github.event_name == 'push' &&

      github.ref == 'refs/heads/main'


    # --------------------------------------------------------
    # Production Environment Approval
    # --------------------------------------------------------

    environment:

      name: production


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: "1.15.8"


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}

          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ------------------------------------------------------
      # Azure Account Diagnostics
      # ------------------------------------------------------

      - name: Azure Account Diagnostics

        run: |

          echo "=========================================="
          echo "Azure Account Diagnostics"
          echo "=========================================="

          az account show \
            --query "{subscription:id,tenant:tenantId,user:user.name}" \
            --output table


      # ------------------------------------------------------
      # Download Reviewed Terraform Plan
      # ------------------------------------------------------

      - name: Download Reviewed Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan

          path: parent_module


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        run: |

          echo "=========================================="
          echo "Reviewed Terraform Plan"
          echo "=========================================="

          ls -lh parent_module/

          test -f parent_module/tfplan

          echo ""

          echo "Reviewed tfplan found successfully"


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: parent_module

        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Apply
      #
      # Apply EXACT plan reviewed by AI.
      # ------------------------------------------------------

      - name: Terraform Apply

        working-directory: parent_module

        run: |

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          echo ""

          echo "Applying AI-reviewed Terraform plan..."

          terraform apply -auto-approve tfplan

          echo ""

          echo "Terraform Apply completed successfully."